<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>First token · Desk</title>
  <link rel="stylesheet" href="../site.css">
</head>
<body>
  <main>
    <p class="kicker" id="kicker">First token · one run</p>
    <p class="hero" id="hero">…</p>
    <p class="unit" id="unit">ms total latency at the playhead</p>
    <svg id="chart" role="img" aria-labelledby="chart-title"></svg>
    <label class="scrub">Scrub the recorded clock
      <input id="scrub" type="range" min="0" max="1" value="1" step="any">
    </label>
    <div class="stats">
      <div>Time to first token<b id="ttft">…</b></div>
      <div>Time per streamed piece<b id="tpot">…</b></div>
      <div>Phase<b id="phase">…</b></div>
    </div>
    <p class="sentence">On this one run the bar before the first piece is prefill, network included, and everything after it is decode.</p>
    <p class="out" id="out"></p>
    <button type="button" id="replay">Replay slowed</button>
    <p class="meta" id="billed"></p>
    <p class="meta" id="meta"></p>
    <p class="cite"><a href="https://llmdojo.dev/learn/inference-optimization/measuring-inference.md">Module 2, Measuring Inference</a></p>
  </main>
  <script src="../metrics.js"></script>
  <script>
    var run, playing = false;
    var hero = document.getElementById("hero");
    var scrub = document.getElementById("scrub");
    var chart = document.getElementById("chart");

    function ms(v) { return v == null ? "—" : Math.round(v) + " ms"; }

    function draw(m) {
      var w = chart.clientWidth || 640;
      var h = 96;
      var end = run.stream_end_ms || 1;
      var x = function (t) { return Math.max(0, Math.min(w, (t / end) * w)); };
      var first = run.tokens[0].t_ms;
      var ticks = "";
      for (var i = 0; i < run.tokens.length; i++) {
        var tx = x(run.tokens[i].t_ms);
        ticks += '<line x1="' + tx + '" y1="58" x2="' + tx + '" y2="78" stroke="#1b1914" stroke-width="1.5"/>';
      }
      var px = x(m.t);
      chart.setAttribute("viewBox", "0 0 " + w + " " + h);
      chart.innerHTML =
        '<title id="chart-title">Prefill until the first piece, then decode. Playhead at ' + Math.round(m.t) + ' ms.</title>' +
        '<rect x="0" y="28" width="' + w + '" height="22" fill="#e4ddd0"/>' +
        '<rect x="0" y="28" width="' + x(first) + '" height="22" fill="#b5522a"/>' +
        '<rect x="' + x(first) + '" y="28" width="' + Math.max(0, w - x(first)) + '" height="22" fill="#1f6f6a"/>' +
        ticks +
        '<line x1="' + px + '" y1="16" x2="' + px + '" y2="86" stroke="#1b1914" stroke-width="2"/>' +
        '<text x="0" y="16" fill="#5e584f" font-size="13" font-family="Palatino, Georgia, serif">prefill</text>' +
        '<text x="' + x(first) + '" y="16" fill="#5e584f" font-size="13" font-family="Palatino, Georgia, serif"> decode</text>';
    }

    function render() {
      var m = metricsAt(run, Number(scrub.value));
      hero.textContent = Math.round(m.total);
      document.getElementById("ttft").textContent = ms(m.ttft);
      document.getElementById("tpot").textContent = m.tpot == null ? "—" : m.tpot.toFixed(1) + " ms";
      document.getElementById("phase").textContent = m.phase;
      document.getElementById("out").textContent = m.text;
      draw(m);
    }

    function stop() { playing = false; }

    document.getElementById("replay").addEventListener("click", function () {
      stop();
      playing = true;
      scrub.value = "0";
      render();
      var t0 = performance.now();
      var dur = Math.max(run.stream_end_ms * 6, 1);
      function frame(now) {
        if (!playing) return;
        var u = Math.min(1, (now - t0) / dur);
        scrub.value = String(u * run.stream_end_ms);
        render();
        if (u < 1) requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    });

    scrub.addEventListener("input", function () { stop(); render(); });
    window.addEventListener("resize", render);

    fetch("../data/first-token.json")
      .then(function (res) { return res.json(); })
      .then(function (data) {
        run = data;
        scrub.max = String(run.stream_end_ms);
        scrub.value = String(run.stream_end_ms);
        document.getElementById("kicker").textContent = "First token · " + run.series + " · " + run.model;
        document.getElementById("meta").textContent = run.machine + ". " + run.clock;
        var mean = billedTpot(run);
        if (mean != null) {
          document.getElementById("billed").textContent =
            run.usage.output_tokens + " billed output tokens arrived in " + run.tokens.length +
            " pieces. Mean decode span per billed token is " + mean.toFixed(1) +
            " ms. The scrubber times the pieces, because this stream did not stamp each token.";
        }
        render();
      });
  </script>
</body>
</html>
