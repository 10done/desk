<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Desk</title>
  <link rel="stylesheet" href="site.css">
</head>
<body>
  <main>
    <p class="kicker">Desk</p>
    <a class="slice" href="first-token/">
      <p class="hero" id="hero">…</p>
      <p class="unit">First token · one streamed run</p>
    </a>
  </main>
  <script>
    fetch("data/first-token.json")
      .then(function (res) { return res.json(); })
      .then(function (run) {
        document.getElementById("hero").textContent = Math.round(run.stream_end_ms) + " ms";
      });
  </script>
</body>
</html>
